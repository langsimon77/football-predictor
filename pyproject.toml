[project]
name = "football-predictor"
version = "0.1.0"
description = "EPL and La Liga match predictions, locked before kickoff and scored honestly."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "duckdb==1.5.5",
    "jax==0.11.2",
    "matplotlib==3.11.2",
    "numpyro==0.22.0",
    "nutpie==0.16.11",
    "pandas==3.0.6",
    "pandera==0.33.1",
    "pyarrow==25.0.1",
    "pymc==6.3.2",
    "requests==2.34.2",
    "scipy==1.18.1",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pandas-stubs==3.0.5.260914",
    "pytest==9.1.1",
    "ruff==0.16.8",
    "types-requests==2.33.0.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
