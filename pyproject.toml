[project]
name = "football-predictor"
version = "0.1.0"
description = "EPL and La Liga match predictions, locked before kickoff and scored honestly."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
