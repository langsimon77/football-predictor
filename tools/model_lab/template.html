<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Predictor Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --ground: #f3f6f1;
  --surface: #ffffff;
  --surface-2: #eaf0e8;
  --ink: #13201a;
  --ink-2: #46574d;
  --muted: #74827a;
  --line: #d9e1d8;
  --grid: #e7ece5;
  --axis: #c3cdc4;
  --accent: #1f6f4a;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe3;
  --home: #2a78d6;
  --draw: #a9a79f;
  --away: #e34948;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --s5: #e87ba4;
  --neutral-series: #8a918c;
  --t-low: #86b6ef;
  --t-med: #3987e5;
  --t-high: #184f95;
  --t-ink-low: #0d366b;
  --t-ink-med: #ffffff;
  --t-ink-high: #ffffff;
  --good: #0ca30c;
  --good-ink: #006300;
  --warn: #fab219;
  --crit: #d03b3b;
  --heat-0: #f3f7fd;
  --heat-1: #184f95;
  --shadow: 0 1px 2px rgba(19, 32, 26, 0.06), 0 4px 16px rgba(19, 32, 26, 0.05);
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0e1411;
    --surface: #151d19;
    --surface-2: #1b2520;
    --ink: #e6eee9;
    --ink-2: #aebbb3;
    --muted: #84928a;
    --line: #26322c;
    --grid: #222c27;
    --axis: #3a4640;
    --accent: #5cc495;
    --accent-ink: #0e1411;
    --accent-soft: #1b3a2b;
    --home: #3987e5;
    --draw: #6b6a64;
    --away: #e66767;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --s5: #d55181;
    --neutral-series: #8f9691;
    --t-low: #1c5cab;
    --t-med: #3987e5;
    --t-high: #86b6ef;
    --t-ink-low: #ffffff;
    --t-ink-med: #ffffff;
    --t-ink-high: #0d366b;
    --good-ink: #0ca30c;
    --heat-0: #17221d;
    --heat-1: #86b6ef;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0e1411;
  --surface: #151d19;
  --surface-2: #1b2520;
  --ink: #e6eee9;
  --ink-2: #aebbb3;
  --muted: #84928a;
  --line: #26322c;
  --grid: #222c27;
  --axis: #3a4640;
  --accent: #5cc495;
  --accent-ink: #0e1411;
  --accent-soft: #1b3a2b;
  --home: #3987e5;
  --draw: #6b6a64;
  --away: #e66767;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --s4: #c98500;
  --s5: #d55181;
  --neutral-series: #8f9691;
  --t-low: #1c5cab;
  --t-med: #3987e5;
  --t-high: #86b6ef;
  --t-ink-low: #ffffff;
  --t-ink-med: #ffffff;
  --t-ink-high: #0d366b;
  --good-ink: #0ca30c;
  --heat-0: #17221d;
  --heat-1: #86b6ef;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; }
html, body { background: var(--ground); }
body {
  margin: 0;
  color: var(--ink);
  font: 15px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: color-mix(in srgb, var(--ground) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
  padding-inline: 16px;
}
.topbar-inner {
  max-width: 1320px;
  margin: 0 auto;
  display: flex;
  align-items: baseline;
  gap: 12px 20px;
  flex-wrap: wrap;
  padding-block: 10px;
}
.brand {
  font-family: var(--display);
  font-weight: 700;
  font-size: 26px;
  letter-spacing: 0.01em;
  line-height: 1;
  margin: 0;
}
.brand small {
  font-family: var(--mono);
  font-weight: 400;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0;
  margin-left: 6px;
}
.asof { color: var(--ink-2); font-size: 13px; }

.shell {
  max-width: 1320px;
  margin: 0 auto;
  padding: 16px;
  padding-block: 16px 48px;
  display: grid;
  grid-template-columns: 208px minmax(0, 1fr);
  gap: 24px;
}
.rail { position: sticky; top: 72px; align-self: start; display: grid; gap: 2px; }
.rail button {
  text-align: left;
  border: 0;
  background: transparent;
  padding: 9px 12px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--ink-2);
  display: grid;
  gap: 1px;
}
.rail button b { font-family: var(--display); font-weight: 600; font-size: 19px; color: var(--ink); letter-spacing: 0.01em; }
.rail button span { font-size: 12.5px; }
.rail button:hover { background: var(--surface-2); }
.rail button[aria-current="page"] { background: var(--accent-soft); }
.rail button[aria-current="page"] b { color: var(--accent); }
.rail .note { margin-top: 14px; padding: 10px 12px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }

main { min-width: 0; display: grid; gap: 18px; align-content: start; }
section[hidden] { display: none !important; }
.section { display: grid; gap: 18px; }
.section-head h2 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 34px;
  line-height: 1.05;
  margin: 0 0 4px;
  text-wrap: balance;
}
.section-head p { margin: 0; color: var(--ink-2); max-width: 72ch; }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  display: grid;
  gap: 12px;
  min-width: 0;
}
.panel h3 {
  font-family: var(--display);
  font-weight: 600;
  font-size: 21px;
  margin: 0;
  letter-spacing: 0.01em;
}
.panel h3 .sub { font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.caption { font-size: 13px; color: var(--ink-2); margin: 0; }
details.explain { font-size: 13.5px; color: var(--ink-2); border-top: 1px dashed var(--line); padding-top: 8px; }
details.explain summary { cursor: pointer; color: var(--accent); font-weight: 700; font-size: 13px; }
details.explain p { margin: 6px 0 0; max-width: 78ch; }
.label-tag { font-size: 11px; font-family: var(--mono); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.ctl { display: grid; gap: 4px; }
.ctl > label, .ctl > .lbl { font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
select, input[type="search"], input[type="number"] {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 10px;
  min-height: 34px;
  max-width: 100%;
}
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 11px; cursor: pointer; font-size: 13.5px; min-height: 34px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 4px 11px;
  cursor: pointer;
  font-size: 13px;
  min-height: 30px;
}
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.btn {
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 8px;
  padding: 7px 14px;
  cursor: pointer;
  font-weight: 700;
  min-height: 34px;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: 0.55; cursor: progress; }
.slider { display: grid; gap: 2px; min-width: 190px; }
.slider .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.slider output { font-family: var(--mono); font-size: 13px; color: var(--ink); }
input[type="range"] { accent-color: var(--accent); width: 100%; }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; cursor: pointer; min-height: 30px; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 700; white-space: nowrap; }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.ref td { background: var(--accent-soft); }
tr.hl td:first-child { font-weight: 700; }
.bar-cell { min-width: 110px; }
.minibar { height: 10px; border-radius: 0 4px 4px 0; background: var(--s1); }
.minibar.muted { background: var(--neutral-series); }
.ci { color: var(--muted); font-size: 12px; }
.pos { color: var(--good-ink); }
.neg { color: var(--crit); }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; }
.kpi .k-label { font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.kpi .k-value { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1.05; }
.kpi .k-value small { font-size: 18px; color: var(--ink-2); font-weight: 600; }
.kpi .k-note { font-size: 12.5px; color: var(--ink-2); }

.tier { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; line-height: 1.6; }
.tier.t0 { background: var(--t-low); color: var(--t-ink-low); }
.tier.t1 { background: var(--t-med); color: var(--t-ink-med); }
.tier.t2 { background: var(--t-high); color: var(--t-ink-high); }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; }
.status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.status.good { color: var(--good-ink); }
.status.bad { color: var(--crit); }
.status.flag { color: var(--muted); }

.chart-box { position: relative; width: 100%; }
.chart-box.h-220 { height: 220px; }
.chart-box.h-260 { height: 260px; }
.chart-box.h-300 { height: 300px; }
.chart-box.h-360 { height: 360px; }
.chart-box.h-440 { height: 440px; }
.chart-box.h-520 { height: 520px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.line { height: 3px; border-radius: 2px; vertical-align: 3px; }

.explorer { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 18px; align-items: start; }
.match-list { max-height: 760px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.match-list button {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 8px;
  width: 100%;
  text-align: left;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  padding: 8px 12px;
  cursor: pointer;
}
.match-list button:hover { background: var(--surface-2); }
.match-list button[aria-current="true"] { background: var(--accent-soft); }
.match-list .teams { font-weight: 700; font-size: 14px; }
.match-list .score { font-family: var(--mono); font-size: 14px; }
.match-list .meta { font-size: 12px; color: var(--muted); }
.match-list .tag { font-family: var(--mono); font-size: 12px; color: var(--ink-2); text-align: right; }
.list-note { font-size: 12.5px; color: var(--muted); }

.stackbar { display: flex; height: 22px; border-radius: 5px; overflow: hidden; gap: 2px; background: var(--surface); }
.stackbar span { display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 11.5px; font-family: var(--mono); min-width: 0; overflow: hidden; white-space: nowrap; }
.stackbar .h { background: var(--home); }
.stackbar .d { background: var(--draw); color: var(--ink); }
.stackbar .a { background: var(--away); }
.model-rows { display: grid; grid-template-columns: minmax(120px, 170px) minmax(0, 1fr) 64px; gap: 6px 10px; align-items: center; font-size: 13px; }
.model-rows .mname { color: var(--ink-2); }
.model-rows .got { font-family: var(--mono); font-size: 12.5px; text-align: right; }

.heat { display: grid; grid-template-columns: 34px repeat(7, minmax(0, 1fr)); gap: 2px; font-family: var(--mono); font-size: 11.5px; max-width: 420px; }
.heat div { aspect-ratio: 1.35; display: flex; align-items: center; justify-content: center; border-radius: 3px; max-width: 100%; }
.heat .hd { color: var(--muted); aspect-ratio: auto; padding: 2px 0; }
.heat .cell.actual { outline: 2px solid var(--ink); outline-offset: -2px; font-weight: 700; }

.pill-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.score-big { font-family: var(--display); font-weight: 700; font-size: 32px; line-height: 1.05; }
.drivers { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.progress > div { height: 100%; width: 0; background: var(--accent); transition: width 120ms linear; }
.small-multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.sm { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 4px; }
.sm h4 { margin: 0; font-size: 13px; font-weight: 700; }
.facts { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.facts li { display: grid; grid-template-columns: 110px 1fr; gap: 10px; font-size: 14px; }
.facts li b { font-family: var(--mono); font-weight: 500; color: var(--ink); }
.tech { font-family: var(--body); font-size: 11.5px; font-weight: 400; color: var(--muted); margin-left: 5px; letter-spacing: 0; text-transform: none; }
.mname .tech { display: block; margin-left: 0; line-height: 1.2; }
.glossary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; margin: 0; }
.glossary div { display: grid; gap: 2px; }
.glossary dt { font-weight: 700; font-size: 14px; }
.glossary dt .tech { margin-left: 6px; }
.glossary dd { margin: 0; font-size: 13.5px; color: var(--ink-2); }

.gw-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin: 4px 0 0; }
.gw-head h3 { font-family: var(--display); font-weight: 700; font-size: 26px; margin: 0; }
.gw-head span { color: var(--muted); font-size: 13px; }
.gw-day { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 6px 0 -4px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); gap: 12px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.pcard .row1 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 12.5px; color: var(--ink-2); }
.pcard .row1 .when { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }
.pcard .row1 .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.lockpill { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); }
.lockpill.on { border-color: var(--ink-2); color: var(--ink); }
.pcard .teams { font-family: var(--display); font-weight: 700; font-size: 23px; line-height: 1.1; }
.pcard .teams .v { font-family: var(--body); font-weight: 400; font-size: 14px; color: var(--muted); margin: 0 4px; }
.pcard .verdict { font-size: 14px; color: var(--ink); }
.pcard .three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.pcard .three b { display: block; font-family: var(--mono); font-size: 15px; color: var(--ink); font-weight: 500; }
.pcard .three span:nth-child(2) { text-align: center; }
.pcard .three span:nth-child(3) { text-align: right; }
.pcard dl { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; margin: 0; font-size: 13px; align-items: center; }
.pcard dt { color: var(--muted); }
.pcard dd { margin: 0; color: var(--ink); }
.pcard dd.t { text-align: right; }
.pcard .fix { border-top: 1px dashed var(--line); padding-top: 6px; display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.pcard .fix b { color: var(--ink); }
.pcard .open { justify-self: start; border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 2px 0; cursor: pointer; font-size: 13px; }
.banner { border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; }
.findings { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 14px; }
.findings li b { color: var(--ink); }

@media (max-width: 1080px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 920px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .rail { position: static; display: flex; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .rail button { flex: 0 0 auto; padding: 6px 10px; }
  .rail button span, .rail .note { display: none; }
  .rail button b { font-size: 17px; }
  .explorer { grid-template-columns: minmax(0, 1fr); }
  .match-list { max-height: 360px; }
  .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); }
  .glossary { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .kpis { grid-template-columns: minmax(0, 1fr); }
  .section-head h2 { font-size: 28px; }
  .model-rows { grid-template-columns: minmax(90px, 110px) minmax(0, 1fr) 52px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<header class="topbar">
  <div class="topbar-inner">
    <h1 class="brand">Football Predictor Lab <small id="version"></small></h1>
    <div class="asof" id="asof"></div>
  </div>
</header>

<div class="shell">
  <nav class="rail" aria-label="Sections">
    <button data-sec="overview"><b>Overview</b><span>How good is the model?</span></button>
    <button data-sec="predictions"><b>Predictions</b><span>This gameweek, EPL and La Liga</span></button>
    <button data-sec="scoreboard"><b>Scoreboard</b><span>Which model scores best?</span></button>
    <button data-sec="explorer"><b>Match explorer</b><span>Any past match, or this gameweek</span></button>
    <button data-sec="calibration"><b>Honesty and confidence</b><span>Does 70% happen 70% of the time?</span></button>
    <button data-sec="ratings"><b>Club strength</b><span>Ratings and season simulator</span></button>
    <button data-sec="evidence"><b>Tests and decisions</b><span>Why the model is built this way</span></button>
    <div class="note">A snapshot, not live. Ask Claude to refresh the Model Lab for newer numbers.</div>
  </nav>

  <main id="main">
    <section class="section" id="sec-overview" hidden></section>
    <section class="section" id="sec-predictions" hidden></section>
    <section class="section" id="sec-scoreboard" hidden></section>
    <section class="section" id="sec-explorer" hidden></section>
    <section class="section" id="sec-calibration" hidden></section>
    <section class="section" id="sec-ratings" hidden></section>
    <section class="section" id="sec-evidence" hidden></section>
  </main>
</div>

<script>const DATA=/*__DATA__*/null;</script>
<script>
(function () {
  "use strict";
  const D = DATA;
  const BT = D.bt;
  const N = BT.n;
  const TUNE = [2021, 2022];
  const TEST = [2023, 2024, 2025];
  const ALL_SEASONS = [2021, 2022, 2023, 2024, 2025];
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const seasonLabel = s => s + "/" + String((s + 1) % 100).padStart(2, "0");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]));
  const MINUS = "−";
  const num = (v, d) => (v < 0 ? MINUS : "") + Math.abs(v).toFixed(d);
  const signed = (v, d) => (v > 0 ? "+" : v < 0 ? MINUS : "") + Math.abs(v).toFixed(d);
  const pct = (v, d) => isFinite(v) ? (v * 100).toFixed(d == null ? 0 : d) + "%" : "n/a";
  const leagueName = l => l === 1 ? "La Liga" : "EPL";

  // ------------------------------------------------------------ decode data
  function dec(arr) {
    const out = new Float64Array(arr.length);
    for (let i = 0; i < arr.length; i++) out[i] = arr[i] < 0 ? NaN : arr[i] / 1000;
    return out;
  }
  const P = {};
  for (const k in BT.p) P[k] = dec(BT.p[k]);
  const B = {};
  for (const k in BT.bin) B[k] = dec(BT.bin[k]);
  const WD = {};
  for (const k in BT.wd) WD[k] = dec(BT.wd[k]);
  const Y = Int8Array.from(BT.y);
  const HG = Int16Array.from(BT.hg), AG = Int16Array.from(BT.ag);
  const COR = Int16Array.from(BT.cor), YEL = Int16Array.from(BT.yel);
  const LG = Int8Array.from(BT.lg), SS = Int16Array.from(BT.ss);
  const PROMO = Int8Array.from(BT.promo), REFK = Int8Array.from(BT.refk), REDS = Int8Array.from(BT.reds);
  const STACK = D.ev.stack;

  function blend(weights) {
    const out = new Float64Array(N * 3);
    STACK.models.forEach((m, j) => {
      const src = P[m];
      const w = weights[j];
      for (let i = 0; i < N * 3; i++) out[i] += w * src[i];
    });
    return out;
  }
  P.stack = blend(STACK.weights);
  P.equal = blend(STACK.models.map(() => 1 / STACK.models.length));

  // Plain names first; the technical name is shown small and grey beside it.
  const MODELS = {
    bdc: { name: "Main model (counts goals)", short: "Main model", tech: "Bayesian Dixon-Coles, published", color: "--s1" },
    stack: { name: "Team of models", short: "Team of models", tech: "stacked ensemble, background only" , color: "--s5" },
    equal: { name: "Simple average of models", short: "Simple average", tech: "equal-weight blend" },
    multinomial: { name: "Simple learner", short: "Simple learner", tech: "multinomial regression" },
    ordered_logit: { name: "Ladder learner", short: "Ladder learner", tech: "ordered logit" },
    random_forest: { name: "Many-trees learner", short: "Many trees", tech: "Random Forest" },
    xgboost: { name: "Boosted-trees learner", short: "Boosted trees", tech: "XGBoost" },
    dc: { name: "Quick goals model", short: "Quick goals", tech: "Dixon-Coles, maximum likelihood" },
    elo: { name: "Club rating points", short: "Rating points", tech: "Elo", color: "--s3" },
    base: { name: "League averages", short: "League averages", tech: "base rates", color: "--neutral-series" },
    mkt_pre: { name: "Bookmakers, Friday", short: "Bookmakers Fri", tech: "average odds, Friday snapshot", color: "--s4" },
    mkt_sharp: { name: "Bookmakers, at kickoff", short: "Bookmakers close", tech: "Pinnacle closing odds", color: "--s2" },
    model: { name: "Main model (counts corners or cards)", short: "Main model", tech: "Poisson for corners, negative binomial for yellows", color: "--s1" },
  };
  // Model names in the live data files.
  const LIVE_NAMES = { dc_bayes_v1: "bdc", dc_mle_v0: "dc", elo_v0: "elo", stack_v1: "stack", multinomial_v1: "multinomial", ordered_logit_v1: "ordered_logit", random_forest_v1: "random_forest", xgboost_v1: "xgboost" };
  const NONEWS = { name: "Main model without team news", tech: "dc_bayes_v1_nonews" };
  function nameHTML(m) {
    const x = MODELS[m] || (m === "nonews" ? NONEWS : { name: m });
    return esc(x.name) + (x.tech ? '<span class="tech">' + esc(x.tech) + "</span>" : "");
  }
  const ORDER_1X2 = ["bdc", "stack", "equal", "multinomial", "ordered_logit", "random_forest", "xgboost", "dc", "elo", "base", "mkt_pre", "mkt_sharp"];

  function happenedFn(kind, line) {
    if (kind === "goals") return i => HG[i] + AG[i] > line ? 1 : 0;
    if (kind === "btts") return i => (HG[i] > 0 && AG[i] > 0) ? 1 : 0;
    if (kind === "corners") return i => COR[i] < 0 ? NaN : (COR[i] > line ? 1 : 0);
    return i => YEL[i] < 0 ? NaN : (YEL[i] > line ? 1 : 0);
  }
  const MARKETS = [{ k: "1x2", name: "Home, draw, away", type: "1x2", tierKey: "1x2" }];
  [1.5, 2.5, 3.5].forEach(l => {
    const models = { bdc: "bdc_goals_" + l, base: "base_goals_" + l };
    if (l === 2.5) { models.mkt_pre = "mkt_pre_goals_2.5"; models.mkt_sharp = "mkt_sharp_goals_2.5"; }
    MARKETS.push({ k: "goals_" + l, name: Math.ceil(l) + " or more goals (over " + l + ")", type: "bin", models, happened: happenedFn("goals", l), tierKey: "over_" + String(l).replace(".", "_"), width: "goals_" + l, kind: "goals" });
  });
  MARKETS.push({ k: "btts", name: "Both teams score", type: "bin", models: { bdc: "bdc_btts", base: "base_btts" }, happened: happenedFn("btts"), tierKey: "btts", width: "btts", kind: "goals" });
  [8.5, 9.5, 10.5, 11.5].forEach(l => MARKETS.push({ k: "corners_" + l, name: Math.ceil(l) + " or more corners (over " + l + ")", type: "bin", models: { model: "model_corners_" + l, base: "base_corners_" + l }, happened: happenedFn("corners", l), tierKey: "corners_over_" + String(l).replace(".", "_"), kind: "corners" }));
  [3.5, 4.5, 5.5].forEach(l => MARKETS.push({ k: "yellows_" + l, name: Math.ceil(l) + " or more yellow cards (over " + l + ")", type: "bin", models: { model: "model_yellows_" + l, base: "base_yellows_" + l }, happened: happenedFn("yellows", l), tierKey: "yellows_over_" + String(l).replace(".", "_"), kind: "yellows" }));
  const marketBy = k => MARKETS.find(m => m.k === k);
  const TH = {};
  (D.ev.tiers.thresholds || []).forEach(t => { TH[t.market] = t; });

  // ------------------------------------------------------------ maths
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const EPS = 1e-15;
  function score1x2(p, i, metric) {
    const ph = p[3 * i], pd = p[3 * i + 1], pa = p[3 * i + 2];
    const y = Y[i];
    if (metric === "log_loss") return -Math.log(Math.max([ph, pd, pa][y], EPS));
    if (metric === "brier") {
      const o = [0, 0, 0]; o[y] = 1;
      return (ph - o[0]) ** 2 + (pd - o[1]) ** 2 + (pa - o[2]) ** 2;
    }
    const c1 = ph - (y === 0 ? 1 : 0);
    const c2 = ph + pd - (y <= 1 ? 1 : 0);
    return (c1 * c1 + c2 * c2) / 2;
  }
  function scoreBin(p, h, metric) {
    if (metric === "brier") return (p - h) ** 2;
    const q = Math.min(Math.max(p, EPS), 1 - EPS);
    return -(h ? Math.log(q) : Math.log(1 - q));
  }
  function mean(a) { let s = 0; for (const v of a) s += v; return a.length ? s / a.length : NaN; }
  function bootMean(vals, B, seed) {
    const n = vals.length;
    if (n < 2) return [NaN, NaN];
    const r = rng(seed || 7);
    const means = new Float64Array(B);
    for (let b = 0; b < B; b++) {
      let s = 0;
      for (let j = 0; j < n; j++) s += vals[(r() * n) | 0];
      means[b] = s / n;
    }
    means.sort();
    return [means[Math.floor(0.025 * B)], means[Math.ceil(0.975 * B) - 1]];
  }
  function bootGap(a, b, B, seed) {
    const r = rng(seed || 11);
    const out = new Float64Array(B);
    for (let k = 0; k < B; k++) {
      let sa = 0, sb = 0;
      for (let j = 0; j < a.length; j++) sa += a[(r() * a.length) | 0];
      for (let j = 0; j < b.length; j++) sb += b[(r() * b.length) | 0];
      out[k] = sa / a.length - sb / b.length;
    }
    out.sort();
    return [out[Math.floor(0.025 * B)], out[Math.ceil(0.975 * B) - 1]];
  }
  function rows(filter) {
    const out = [];
    for (let i = 0; i < N; i++) {
      if (filter.leagues.indexOf(LG[i]) < 0) continue;
      if (filter.seasons.indexOf(SS[i]) < 0) continue;
      out.push(i);
    }
    return out;
  }
  function tv(p, q, i) {
    return 0.5 * (Math.abs(p[3 * i] - q[3 * i]) + Math.abs(p[3 * i + 1] - q[3 * i + 1]) + Math.abs(p[3 * i + 2] - q[3 * i + 2]));
  }
  function argmax3(p, i) {
    const a = p[3 * i], b = p[3 * i + 1], c = p[3 * i + 2];
    return a >= b && a >= c ? 0 : (b >= c ? 1 : 2);
  }
  function calibrationSlope(f, o, bins) {
    const idx = Array.from(f.keys()).sort((x, y) => f[x] - f[y]);
    const k = bins || 5;
    const xs = [], ys = [];
    for (let g = 0; g < k; g++) {
      const part = idx.slice(Math.floor(g * idx.length / k), Math.floor((g + 1) * idx.length / k));
      if (!part.length) continue;
      xs.push(mean(part.map(j => f[j])));
      ys.push(mean(part.map(j => o[j])));
    }
    const mx = mean(xs), my = mean(ys);
    let sxy = 0, sxx = 0;
    for (let j = 0; j < xs.length; j++) { sxy += (xs[j] - mx) * (ys[j] - my); sxx += (xs[j] - mx) ** 2; }
    return sxx > 0 ? sxy / sxx : NaN;
  }
  function ece(f, o, bands) {
    const k = bands || 10;
    const sumF = new Float64Array(k), sumO = new Float64Array(k), cnt = new Float64Array(k);
    for (let j = 0; j < f.length; j++) {
      const b = Math.min(Math.floor(f[j] * k), k - 1);
      sumF[b] += f[j]; sumO[b] += o[j]; cnt[b]++;
    }
    let tot = 0;
    for (let b = 0; b < k; b++) if (cnt[b]) tot += Math.abs(sumF[b] / cnt[b] - sumO[b] / cnt[b]) * cnt[b];
    return tot / f.length;
  }

  // ------------------------------------------------------------ theme and charts
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const charts = {};
  function chart(id, config) {
    if (charts[id]) { charts[id].destroy(); delete charts[id]; }
    const el = document.getElementById(id);
    if (!el || typeof Chart === "undefined") return null;
    charts[id] = new Chart(el.getContext("2d"), config);
    return charts[id];
  }
  function baseOptions(extra) {
    const ink2 = css("--ink-2"), grid = css("--grid"), axis = css("--axis");
    const font = { family: getComputedStyle(document.body).fontFamily, size: 12 };
    const o = {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: css("--surface"),
          titleColor: css("--ink"),
          bodyColor: css("--ink-2"),
          borderColor: css("--line"),
          borderWidth: 1,
          padding: 10,
          titleFont: { family: font.family, size: 12.5, weight: "bold" },
          bodyFont: { family: font.family, size: 12.5 },
        },
      },
      scales: {
        x: { grid: { color: grid, drawTicks: false }, border: { color: axis }, ticks: { color: ink2, font, padding: 6 } },
        y: { grid: { color: grid, drawTicks: false }, border: { color: axis }, ticks: { color: ink2, font, padding: 6 } },
      },
    };
    return deepMerge(o, extra || {});
  }
  function deepMerge(a, b) {
    for (const k in b) {
      if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && a[k] && typeof a[k] === "object") deepMerge(a[k], b[k]);
      else a[k] = b[k];
    }
    return a;
  }
  const diagonal = { label: "Perfectly honest", data: [{ x: 0, y: 0 }, { x: 1, y: 1 }], type: "line", borderColor: () => css("--axis"), borderDash: [4, 4], borderWidth: 1.5, pointRadius: 0, pointHitRadius: 0 };

  // Error bars and direct labels drawn by a small plugin.
  const whiskers = {
    id: "whiskers",
    afterDatasetsDraw(ch) {
      const ctx = ch.ctx;
      ch.data.datasets.forEach((ds, di) => {
        if (ch.getDatasetMeta(di).hidden) return;
        const meta = ch.getDatasetMeta(di);
        (ds.whiskers || []).forEach((w, j) => {
          const pt = meta.data[j];
          if (!pt || !w) return;
          ctx.save();
          ctx.strokeStyle = ds.whiskerColor || css("--axis");
          ctx.lineWidth = 1.5;
          if (w.y) {
            const y0 = ch.scales.y.getPixelForValue(w.y[0]), y1 = ch.scales.y.getPixelForValue(w.y[1]);
            ctx.beginPath(); ctx.moveTo(pt.x, y0); ctx.lineTo(pt.x, y1); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(pt.x - 4, y0); ctx.lineTo(pt.x + 4, y0); ctx.moveTo(pt.x - 4, y1); ctx.lineTo(pt.x + 4, y1); ctx.stroke();
          }
          if (w.x) {
            const x0 = ch.scales.x.getPixelForValue(w.x[0]), x1 = ch.scales.x.getPixelForValue(w.x[1]);
            ctx.beginPath(); ctx.moveTo(x0, pt.y); ctx.lineTo(x1, pt.y); ctx.stroke();
          }
          ctx.restore();
        });
        (ds.pointLabels || []).forEach((lab, j) => {
          const pt = meta.data[j];
          if (!pt || !lab) return;
          ctx.save();
          ctx.fillStyle = css("--ink-2");
          ctx.font = "11.5px " + getComputedStyle(document.body).fontFamily;
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillText(lab, pt.x + 7, pt.y - 7);
          ctx.restore();
        });
      });
    },
  };
  if (typeof Chart !== "undefined") Chart.register(whiskers);

  function legendHTML(items) {
    return '<div class="legend">' + items.map(it => '<span><i class="' + (it.line ? "line" : "") + '" style="background:' + it.color + '"></i>' + esc(it.label) + "</span>").join("") + "</div>";
  }
  function explain(html) {
    return '<details class="explain"><summary>What this means</summary>' + html + "</details>";
  }
  function segHTML(id, options, value) {
    return '<div class="seg" role="group" id="' + id + '">' + options.map(o => '<button type="button" data-v="' + esc(o.v) + '" aria-pressed="' + (String(o.v) === String(value)) + '">' + esc(o.label) + "</button>").join("") + "</div>";
  }
  function bindSeg(id, fn) {
    const box = document.getElementById(id);
    box.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      $$("button", box).forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      fn(b.dataset.v);
    });
  }
  function chipsHTML(id, options, selected) {
    return '<div class="chips" id="' + id + '">' + options.map(o => '<button type="button" class="chip" data-v="' + esc(o.v) + '" aria-pressed="' + (selected.indexOf(o.v) >= 0) + '">' + esc(o.label) + "</button>").join("") + "</div>";
  }
  function bindChips(id, fn) {
    const box = document.getElementById(id);
    box.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"));
      const vals = $$("button", box).filter(x => x.getAttribute("aria-pressed") === "true").map(x => x.dataset.v);
      if (!vals.length) { b.setAttribute("aria-pressed", "true"); vals.push(b.dataset.v); }
      fn(vals);
    });
  }
  function tierBadge(level) {
    if (level == null || level < 0) return '<span class="ci">none</span>';
    return '<span class="tier t' + level + '">' + ["Low", "Medium", "High"][level] + "</span>";
  }

  // ------------------------------------------------------------ shared tier logic
  const tierState = {
    forecast: "bdc",
    high: TH["1x2"] ? TH["1x2"].high : 0.58,
    low: TH["1x2"] ? TH["1x2"].low : 0.44,
    width: TH["1x2"] ? TH["1x2"].width_max : 0.16,
    dis: TH["1x2"] ? TH["1x2"].disagree_max : 0.07,
    useWidth: true,
    useDis: true,
    promoFlag: false,
  };
  function tier1x2(i, st) {
    const p = P[st.forecast];
    const top = argmax3(p, i);
    const fav = p[3 * i + top];
    const width = [WD.home, WD.draw, WD.away][top][i];
    const dis = tv(P.stack, P.bdc, i);
    let lvl = fav >= st.high - 1e-9 ? 2 : (fav < st.low - 1e-9 ? 0 : 1);
    let demote = false;
    if (st.useWidth && isFinite(width) && width > st.width + 1e-9) demote = true;
    if (st.useDis && isFinite(dis) && dis > st.dis + 1e-9) demote = true;
    if (demote) lvl = Math.max(0, lvl - 1);
    const flags = st.promoFlag && PROMO[i] ? 1 : 0;
    if (flags >= 1) lvl = Math.min(lvl, 1);
    return { lvl, fav, width, dis, top, hit: top === Y[i] ? 1 : 0, flags };
  }
  function tierBin(i, mk, st) {
    const key = mk.models.bdc || mk.models.model;
    const p = B[key][i];
    const h = mk.happened(i);
    if (!isFinite(p) || !isFinite(h)) return null;
    const fav = Math.max(p, 1 - p);
    const width = mk.width ? WD[mk.width][i] : NaN;
    let lvl = fav >= st.high - 1e-9 ? 2 : (fav < st.low - 1e-9 ? 0 : 1);
    if (st.useWidth && isFinite(width) && st.width != null && width > st.width + 1e-9) lvl = Math.max(0, lvl - 1);
    let flags = 0;
    if (st.promoFlag && PROMO[i]) flags++;
    if (mk.kind === "yellows" && st.refFlag && !REFK[i]) flags++;
    if (flags >= 1) lvl = Math.min(lvl, 1);
    if (flags >= 2) lvl = 0;
    const hit = (p >= 0.5 ? h : 1 - h);
    const q = Math.min(Math.max(p, EPS), 1 - EPS);
    const surprise = -(h ? Math.log(q) : Math.log(1 - q));
    const entropy = -(q * Math.log(q) + (1 - q) * Math.log(1 - q));
    return { lvl, fav, width, hit, surprise, excess: surprise - entropy, flags };
  }

  // ------------------------------------------------------------ navigation
  const rendered = {};
  const renderers = {};
  function show(sec) {
    if (!renderers[sec]) sec = "overview";
    $$(".rail button").forEach(b => b.setAttribute("aria-current", b.dataset.sec === sec ? "page" : "false"));
    $$("main > section").forEach(s => { s.hidden = s.id !== "sec-" + sec; });
    if (!rendered[sec]) { renderers[sec](); rendered[sec] = true; }
    else if (renderers[sec].refresh) renderers[sec].refresh();
    try { localStorage.setItem("fp-lab-section", sec); } catch (e) { /* storage may be blocked */ }
    if (location.hash !== "#" + sec) history.replaceState(null, "", "#" + sec);
  }
  $$(".rail button").forEach(b => b.addEventListener("click", () => { show(b.dataset.sec); window.scrollTo({ top: 0 }); }));
  function rerenderAll() {
    Object.keys(rendered).forEach(k => { rendered[k] = false; });
    const cur = ($(".rail button[aria-current='page']") || {}).dataset;
    show(cur ? cur.sec : "overview");
  }
  new MutationObserver(rerenderAll).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", rerenderAll);

  // ------------------------------------------------------------ header
  $("#version").textContent = "model " + (D.model_version || "").slice(0, 7);
  $("#asof").textContent = "Snapshot made " + D.built + ". This gameweek's forecasts come from the daily run of " + D.data_as_of.replace("T", " ").replace("Z", " UTC") + ". Past-season tests: 2021/22 to 2025/26.";

  // ============================================================ OVERVIEW
  renderers.overview = function () {
    const sec = $("#sec-overview");
    const idx = rows({ leagues: [0, 1], seasons: TEST }).filter(i => ORDER_1X2.every(m => isFinite(P[m][3 * i])));
    const ll = {};
    ORDER_1X2.forEach(m => { ll[m] = mean(idx.map(i => score1x2(P[m], i, "log_loss"))); });
    const tierRows = [0, 1, 2].map(l => {
      const t = idx.map(i => tier1x2(i, Object.assign({}, tierState, { forecast: "bdc" }))).filter(r => r.lvl === l);
      return { n: t.length, won: mean(t.map(r => r.hit)), promised: mean(t.map(r => r.fav)) };
    });
    const up = D.up.rows;
    const locked = up.filter(r => r.locked).length;
    const ladder = ORDER_1X2.slice().sort((a, b) => ll[b] - ll[a]);
    sec.innerHTML =
      '<div class="section-head"><h2>How good is the model?</h2><p>We replayed five past seasons as if they were live: each match was forecast using only what was known a day or two before kickoff. The last three seasons (2023/24 to 2025/26, ' + idx.length.toLocaleString() + " matches with bookmaker prices) were kept aside and scored once, so the model never learned from them. Every number here is worked out in your browser from those saved forecasts.</p></div>" +
      '<div class="kpis">' +

      '<div class="grid-2">' +

      '<p class="caption">Average surprise score per match on the same ' + idx.length.toLocaleString() + " matches. Shorter bars are better. Blue is the main model; orange bars are the bookmakers.</p>" +
      explain("<p>The <b>surprise score</b> (log loss) asks: how much chance did the forecast give to what really happened? Giving the actual result a high chance scores low (good); calling it unlikely scores high (bad). A blind guess of one third for each result scores 1.0986. The main model sits level with the machine-learning models (all within 0.005), clearly ahead of league averages, and about 0.016 behind the bookmakers' Friday prices.</p>") +
      "</div>" +
      '<div class="panel"><h3>How the system works</h3>' +
      '<ul class="facts">' +
      fact("Data", "Results, shots, corners, cards and bookmaker odds since 2016/17 (football-data.co.uk); fixtures from openfootball and football-data.org. Odds are only used to judge the model, never to make forecasts.") +
      fact("Goals", "The main model gives each club an attack and a defence strength, learned from goals and shots on target, with recent matches counting more. Newly promoted clubs start from their second-division form.") +
      fact("Corners", "A count model for total corners, from each club's usual corner numbers, the strength gap and recent shots.") +
      fact("Yellows", "A count model for total yellow cards, from each club's discipline, the referee (EPL only), how close the match should be, derbies and recent fouls.") +
      fact("Locking", "Each forecast is locked 24 to 48 hours before kickoff in a record that can only grow, so nothing can be changed after the result.") +
      fact("Team news", "Your answers to the daily question Issue (players missing) nudge the scoring rates, by at most 12%.") +
      fact("Confidence", "Each forecast gets High, Medium or Low: how far to trust it, from how clear the favourite is, how sure the model is, and any data problems.") +
      fact("Background", "Seven other models are locked and scored every day but never published. They show whether a different approach would do better.") +
      "</ul>" +
      "</div></div>" +
      '<div class="panel"><h3>Words used in this lab</h3><dl class="glossary">' +
      gloss("Surprise score", "log loss", "How much chance the forecast gave to what happened, turned into a penalty. Lower is better. It punishes confident misses hardest.") +
      gloss("Closeness score", "RPS", "For home, draw, away only. Calling a draw when the home side won costs less than calling an away win. Lower is better.") +
      gloss("Squared error", "Brier score", "The squared distance between the forecast and what happened (1 or 0). Lower is better.") +
      gloss("Honest forecast", "calibration", "When the model says 70%, it happens about 70% of the time. A model can be honest and still not very sharp.") +
      gloss("Too cautious", "timid, slope above 1", "Strong favourites win more often than the model says. The main model's known weakness.") +
      gloss("Range of likely values", "95% bootstrap interval", "We re-draw the list of matches thousands of times to see how much a result could move by luck. If the whole range is below zero, the gain is real.") +
      gloss("Strict rule", "adoption rule", "A change goes live only if its whole range of likely values shows a gain, and only after you approve it.") +
      gloss("Locked or provisional", "ledger", "Locked forecasts are final and get scored. Provisional ones still update once a day until they lock.") +
      gloss("Confidence", "tiers", "High, Medium or Low. High-confidence favourites won about three times in four in the test seasons.") +
      gloss("Background model", "shadow", "Runs every day and is scored, but is never shown as the forecast.") +
      "</dl></div>";
    const items = ladder.map(m => ({ m, v: ll[m] }));
    chart("ov-ladder", {
      type: "bar",
      data: {
        labels: items.map(it => MODELS[it.m].short),
        datasets: [{
          data: items.map(it => it.v),
          backgroundColor: items.map(it => it.m === "bdc" ? css("--s1") : (it.m.startsWith("mkt") ? css("--s2") : css("--neutral-series"))),
          borderRadius: 4, borderSkipped: "start", barPercentage: 0.72,
        }],
      },
      options: baseOptions({
        indexAxis: "y",
        scales: { x: { min: 0.94, max: 1.08, title: { display: true, text: "Average surprise score (lower is better)", color: css("--muted") } }, y: { grid: { display: false } } },
        plugins: { tooltip: { callbacks: { title: c => MODELS[items[c[0].dataIndex].m].name + " (" + MODELS[items[c[0].dataIndex].m].tech + ")", label: c => " surprise score " + c.raw.toFixed(4) } } },
      }),
    });
  };
  function kpi(label, value, note) {
    return '<div class="kpi"><div class="k-label">' + esc(label) + '</div><div class="k-value">' + value + '</div><div class="k-note">' + esc(note) + "</div></div>";
  }
  function fact(k, v) { return "<li><b>" + esc(k) + "</b><span>" + esc(v) + "</span></li>"; }
  function gloss(term, tech, text) { return "<div><dt>" + esc(term) + '<span class="tech">' + esc(tech) + "</span></dt><dd>" + esc(text) + "</dd></div>"; }

  // ============================================================ PREDICTIONS
  // Juba is UTC+2 all year (no summer time), so the shift is fixed.
  const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function juba(iso) {
    const d = new Date(Date.parse(iso) + 2 * 3600e3);
    const two = v => String(v).padStart(2, "0");
    return { day: DAYS[d.getUTCDay()] + " " + d.getUTCDate() + " " + MONTHS[d.getUTCMonth()], time: two(d.getUTCHours()) + ":" + two(d.getUTCMinutes()), key: d.toISOString().slice(0, 10) };
  }
  const TIER_LEVEL = t => ["Low", "Medium", "High"].indexOf(t);
  function gameweek() {
    // The current gameweek: the earliest round of each league in the snapshot.
    const first = {};
    D.up.rows.forEach(r => { if (!first[r.lg] || r.kickoff < first[r.lg].kickoff) first[r.lg] = r; });
    return D.up.rows.filter(r => first[r.lg] && r.round === first[r.lg].round);
  }
  function verdict(r, p) {
    const top = p.indexOf(Math.max(...p));
    if (top === 1) return "A draw is the single likeliest result, but only just.";
    const team = "<b>" + esc(D.clubs[top === 0 ? r.h : r.a]) + "</b>";
    if (p[top] >= 0.6) return team + " are clear favourites.";
    if (p[top] >= 0.45) return team + " are slight favourites.";
    return "Too close to call: " + team + " shade it.";
  }
  const pr = { league: "both", sort: "time", fix: false };
  renderers.predictions = function () {
    const sec = $("#sec-predictions");
    const gw = gameweek();
    const locked = gw.filter(r => r.locked).length;
    const high = gw.filter(r => r.tiers && r.tiers["1x2"] === "High").length;
    const fav = gw.map(r => ({ r, p: Math.max(r.p[0], r.p[2]) / 1000, side: r.p[0] >= r.p[2] ? r.h : r.a })).sort((a, b) => b.p - a.p)[0];
    const roundOf = lg => { const x = gw.find(r => r.lg === lg); return x ? x.round : ""; };
    const hasFix = gw.some(r => r.fix);
    sec.innerHTML =
      '<div class="section-head"><h2>This gameweek</h2><p>Forecasts for the current gameweek: Premier League ' + esc(roundOf(0)) + " and La Liga " + esc(roundOf(1)) + ". Kickoff times are Juba time. <b>Locked</b> forecasts are final and will be scored; <b>provisional</b> ones still update at each daily run until they lock, 24 to 48 hours before kickoff.</p></div>" +
      '<div class="kpis">' +
      kpi("Matches", String(gw.length), "Premier League " + gw.filter(r => r.lg === 0).length + ", La Liga " + gw.filter(r => r.lg === 1).length + ".") +
      kpi("Locked so far", locked + " <small>of " + gw.length + "</small>", locked === gw.length ? "Every forecast is final." : (gw.length - locked) + " will lock at the next daily runs.") +
      kpi("High confidence", String(high), "Matches where the home, draw, away forecast is rated High.") +
      kpi("Biggest favourite", fav ? esc(D.clubs[fav.side]) + " <small>" + pct(fav.p) + "</small>" : "none", fav ? "Against " + D.clubs[fav.side === fav.r.h ? fav.r.a : fav.r.h] + "." : "") +
      "</div>" +
      '<div class="panel"><div class="controls">' +
      '<div class="ctl"><span class="lbl">League</span>' + segHTML("pr-league", [{ v: "both", label: "Both" }, { v: "0", label: "Premier League" }, { v: "1", label: "La Liga" }], pr.league) + "</div>" +
      '<div class="ctl"><span class="lbl">Order</span>' + segHTML("pr-sort", [{ v: "time", label: "Kickoff" }, { v: "conf", label: "Clearest favourite" }, { v: "close", label: "Closest call" }], pr.sort) + "</div>" +
      (hasFix ? '<label class="toggle"><input type="checkbox" id="pr-fix"' + (pr.fix ? " checked" : "") + "> Also show the proposed fix (not live)</label>" : "") +
      "</div>" +
      explain("<p>Each card shows the chances of a home win, a draw and an away win (blue, grey, red), the single most likely score, and the expected goals, corners and yellow cards. The likely score is only the best single guess: even the top score happens in only about one match in eight. <b>3 or more goals</b> is the over 2.5 line; <b>10 or more corners</b> is over 9.5; <b>5 or more yellow cards</b> is over 4.5. The badge on each line says how far to trust it: High, Medium or Low. It rates the likelier side, so <b>Both score 42%</b> with <b>High</b> means the model is fairly sure at least one side will not score. A newly promoted club early in the season, an unanswered team-news question, or an unknown referee all lower the confidence.</p>") +
      "</div>" +
      '<div id="pr-fix-note"></div><div id="pr-list" style="display:grid;gap:14px"></div>';
    bindSeg("pr-league", v => { pr.league = v; draw(); });
    bindSeg("pr-sort", v => { pr.sort = v; draw(); });
    if (hasFix) $("#pr-fix").addEventListener("change", e => { pr.fix = e.target.checked; draw(); });
    $("#pr-list").addEventListener("click", e => {
      const b = e.target.closest("button.open");
      if (!b) return;
      ex.source = "up"; ex.sel = b.dataset.id; rendered.explorer = false;
      show("explorer"); window.scrollTo({ top: 0 });
    });
    function line(label, value, tierKey, tiers) {
      const t = tierKey && tiers[tierKey] ? tierBadge(TIER_LEVEL(tiers[tierKey])) : "";
      return "<dt>" + label + "</dt><dd>" + value + '</dd><dd class="t">' + t + "</dd>";
    }
    function card(r) {
      const p = r.p.map(v => v / 1000);
      const when = juba(r.kickoff);
      const tiers = r.tiers || {};
      const home = esc(D.clubs[r.h]), away = esc(D.clubs[r.a]);
      const g = r.goals;
      let html = '<article class="pcard"><div class="row1"><span class="when">' + when.time + "</span><span>" + leagueName(r.lg) + '</span><span class="right"><span class="lockpill' + (r.locked ? " on" : "") + '">' + (r.locked ? "Locked" : "Provisional") + "</span>" + (tiers["1x2"] ? tierBadge(TIER_LEVEL(tiers["1x2"])) : "") + "</span></div>" +
        '<div class="teams">' + home + '<span class="v">v</span>' + away + "</div>" +
        '<div class="verdict">' + verdict(r, p) + "</div>" +
        stackbar(p[0], p[1], p[2]) +
        '<div class="three"><span>' + home + " win<b>" + pct(p[0]) + "</b></span><span>Draw<b>" + pct(p[1]) + "</b></span><span>" + away + " win<b>" + pct(p[2]) + "</b></span></div><dl>" +
        line("Likely score", r.score ? "<b>" + esc(r.score) + "</b> <span class='ci'>(" + pct(r.score_p) + " chance)</span>" : "", null, tiers) +
        line("Goals", home + " " + g.exp_home.toFixed(1) + ", " + away + " " + g.exp_away.toFixed(1) + "; 3 or more: <b>" + pct(g["over_2.5"]) + "</b>", "over_2_5", tiers) +
        line("Both score", "<b>" + pct(g.btts) + "</b>", "btts", tiers) +
        line("Corners", r.corners != null ? "about " + r.corners.toFixed(1) + "; 10 or more: <b>" + pct(r.c95) + "</b>" : "<span class='ci'>not available</span>", "corners_over_9_5", tiers) +
        line("Yellow cards", r.yellows != null ? "about " + r.yellows.toFixed(1) + "; 5 or more: <b>" + pct(r.y45) + "</b>" : "<span class='ci'>not available</span>", "yellows_over_4_5", tiers) +
        "</dl>";
      if (r.news && r.news.length) html += '<div class="caption">Team news: ' + esc(r.news.join("; ")) + "</div>";
      if (pr.fix && r.fix) {
        const q = r.fix.p, d = k => Math.abs(q[k] - p[k]) < 0.005 ? "same" : signed((q[k] - p[k]) * 100, 0) + " pts";
        html += '<div class="fix"><span><b>Proposed fix, not live:</b> ' + home + " win " + pct(q[0]) + " (" + d(0) + "), draw " + pct(q[1]) + " (" + d(1) + "), " + away + " win " + pct(q[2]) + " (" + d(2) + ").</span><span>3 or more goals " + pct(r.fix.o25) + "; both score " + pct(r.fix.btts) + "; likely score " + esc(r.fix.score) + ".</span></div>";
      }
      html += '<button type="button" class="open" data-id="' + esc(r.id) + '">See every model for this match</button></article>';
      return html;
    }
    function draw() {
      $("#pr-fix-note").innerHTML = pr.fix ? '<div class="banner"><b>Not live.</b> The fix lines show what the proposed change in Tests and decisions would do to these forecasts. The published forecasts stay as they are unless you approve it.</div>' : "";
      const leagues = pr.league === "both" ? [0, 1] : [Number(pr.league)];
      let out = "";
      leagues.forEach(lg => {
        let rs = gw.filter(r => r.lg === lg);
        if (!rs.length) return;
        const top = r => Math.max(...r.p);
        if (pr.sort === "conf") rs.sort((a, b) => top(b) - top(a));
        else if (pr.sort === "close") rs.sort((a, b) => top(a) - top(b));
        else rs.sort((a, b) => a.kickoff.localeCompare(b.kickoff));
        out += '<div class="gw-head"><h3>' + (lg === 0 ? "Premier League" : "La Liga") + "</h3><span>" + esc(rs[0].round || "") + ", " + rs.length + " matches, " + rs.filter(r => r.locked).length + " locked</span></div>";
        if (pr.sort === "time") {
          const days = [];
          rs.forEach(r => { const k = juba(r.kickoff); if (!days.length || days[days.length - 1].key !== k.key) days.push({ key: k.key, day: k.day, rows: [] }); days[days.length - 1].rows.push(r); });
          days.forEach(dd => { out += '<div class="gw-day">' + dd.day + '</div><div class="cards">' + dd.rows.map(card).join("") + "</div>"; });
        } else {
          out += '<div class="cards">' + rs.map(card).join("") + "</div>";
        }
      });
      $("#pr-list").innerHTML = out || '<p class="caption">No matches in this snapshot.</p>';
    }
    draw();
  };

  // ============================================================ SCOREBOARD
  const sb = { market: "1x2", leagues: [0, 1], seasons: TEST.slice(), metric: "log_loss", ref: "bdc", models: ORDER_1X2.slice() };
  renderers.scoreboard = function () {
    const sec = $("#sec-scoreboard");
    sec.innerHTML =
      '<div class="section-head"><h2>Which model scores best?</h2><p>Pick a market, the leagues and seasons, and a model to compare against. Every model is scored on exactly the same matches. Comparing two models match by match cancels out most of the luck, so small real differences can show up.</p></div>' +
      '<div class="panel"><div class="controls">' +
      '<div class="ctl"><label for="sb-market">Market</label><select id="sb-market">' + MARKETS.map(m => '<option value="' + m.k + '"' + (m.k === sb.market ? " selected" : "") + ">" + esc(m.name) + "</option>").join("") + "</select></div>" +
      '<div class="ctl"><span class="lbl">League</span>' + segHTML("sb-league", [{ v: "both", label: "Both" }, { v: "0", label: "EPL" }, { v: "1", label: "La Liga" }], "both") + "</div>" +
      '<div class="ctl"><span class="lbl">Seasons</span>' + chipsHTML("sb-seasons", ALL_SEASONS.map(s => ({ v: String(s), label: seasonLabel(s) })), sb.seasons.map(String)) + "</div>" +
      '<div class="ctl"><span class="lbl">Score type</span><div id="sb-metric-box"></div></div>' +
      '<div class="ctl"><label for="sb-ref">Compare against</label><select id="sb-ref"></select></div>' +
      "</div>" +
      '<div class="ctl"><span class="lbl">Models shown</span><div id="sb-models"></div></div></div>' +
      '<div class="panel"><h3 id="sb-title">Scores</h3><div class="table-wrap"><table id="sb-table"></table></div><p class="caption" id="sb-caption"></p>' +
      explain("<p><b>Surprise score</b> (log loss) punishes confident misses hardest. <b>Closeness score</b> (RPS, home, draw, away only) gives partial credit for being near: calling a draw when the home side won costs less than calling an away win. <b>Squared error</b> (Brier) is the squared distance from the result. For all three, lower is better. The <b>range</b> is a 95% range of likely values: we re-draw the match list 400 times to see how far luck could move the score. The <b>difference</b> column compares each model with the one you picked, match by match. If its whole range is below zero, that model is clearly better on these matches; if the range crosses zero, we cannot tell them apart.</p>") +
      "</div>" +
      '<div class="grid-2">' +
      '<div class="panel"><h3>Score by model</h3><div class="chart-box h-360"><canvas id="sb-bars"></canvas></div><p class="caption">Average score per model, with its range. The model you compare against is blue. Shorter is better.</p></div>' +
      '<div class="panel"><h3>Running average, match by match</h3><div id="sb-run-legend"></div><div class="chart-box h-360"><canvas id="sb-run"></canvas></div><p class="caption">The average score so far, in date order, for up to five headline forecasts.</p>' +
      explain("<p>The start of each line jumps about because a few shock results dominate a short average. Lines that stay apart for hundreds of matches show a real difference; lines that keep crossing do not.</p>") +
      "</div></div>" +
      '<div class="panel"><h3>Season by season</h3><div class="table-wrap"><table id="sb-seasons-table"></table></div><p class="caption">Average score for each season on its own. A model that wins one season and loses the next has no steady edge.</p></div>';
    $("#sb-market").addEventListener("change", e => { sb.market = e.target.value; setupModels(); draw(); });
    bindSeg("sb-league", v => { sb.leagues = v === "both" ? [0, 1] : [Number(v)]; draw(); });
    bindChips("sb-seasons", vals => { sb.seasons = vals.map(Number); draw(); });
    $("#sb-ref").addEventListener("change", e => { sb.ref = e.target.value; draw(); });
    function available() {
      const mk = marketBy(sb.market);
      return mk.type === "1x2" ? ORDER_1X2.slice() : Object.keys(mk.models);
    }
    function setupModels() {
      const avail = available();
      const mk = marketBy(sb.market);
      if (mk.type !== "1x2" && sb.metric === "rps") sb.metric = "log_loss";
      $("#sb-metric-box").innerHTML = segHTML("sb-metric", (mk.type === "1x2" ? [{ v: "log_loss", label: "Surprise" }, { v: "rps", label: "Closeness" }, { v: "brier", label: "Squared error" }] : [{ v: "log_loss", label: "Surprise" }, { v: "brier", label: "Squared error" }]), sb.metric);
      bindSeg("sb-metric", v => { sb.metric = v; draw(); });
      sb.models = avail.slice();
      if (avail.indexOf(sb.ref) < 0) sb.ref = avail[0];
      $("#sb-ref").innerHTML = avail.map(m => '<option value="' + m + '"' + (m === sb.ref ? " selected" : "") + ">" + esc(MODELS[m].name + " (" + MODELS[m].tech + ")") + "</option>").join("");
      $("#sb-models").innerHTML = chipsHTML("sb-model-chips", avail.map(m => ({ v: m, label: MODELS[m].short })), sb.models);
      bindChips("sb-model-chips", vals => { sb.models = vals; if (sb.models.indexOf(sb.ref) < 0) sb.models.push(sb.ref); draw(); });
    }
    function scoresFor(mk, models, idx) {
      const out = {};
      models.forEach(m => {
        if (mk.type === "1x2") out[m] = idx.map(i => score1x2(P[m], i, sb.metric));
        else { const arr = B[mk.models[m]]; out[m] = idx.map(i => scoreBin(arr[i], mk.happened(i), sb.metric)); }
      });
      return out;
    }
    function commonIdx(mk, models, filt) {
      return rows(filt).filter(i => {
        if (mk.type === "1x2") return models.every(m => isFinite(P[m][3 * i]));
        const h = mk.happened(i);
        return isFinite(h) && models.every(m => isFinite(B[mk.models[m]][i]));
      });
    }
    function draw() {
      const mk = marketBy(sb.market);
      const models = sb.models.slice();
      const idx = commonIdx(mk, models, { leagues: sb.leagues, seasons: sb.seasons });
      const sc = scoresFor(mk, models, idx);
      const ref = sc[sb.ref];
      const res = models.map(m => {
        const v = sc[m];
        const ci = bootMean(v, 400, 3);
        const diff = v.map((x, j) => x - ref[j]);
        const dci = m === sb.ref ? [NaN, NaN] : bootMean(diff, 400, 5);
        return { m, mean: mean(v), ci, diff: mean(diff), dci };
      }).sort((a, b) => a.mean - b.mean);
      const metricName = { log_loss: "Surprise score", rps: "Closeness score", brier: "Squared error" }[sb.metric];
      $("#sb-title").textContent = mk.name + ": " + metricName;
      const maxV = Math.max(...res.map(r => r.mean)), minV = Math.min(...res.map(r => r.mean));
      $("#sb-table").innerHTML = "<thead><tr><th>Model</th><th class='num'>Average</th><th class='num'>Range (95%)</th><th class='num'>Difference from " + esc(MODELS[sb.ref].short) + "</th><th class='num'>Range (95%)</th><th>Verdict</th><th class='bar-cell'></th></tr></thead><tbody>" +
        res.map(r => {
          let verdict = '<span class="status flag">compared against</span>';

  function stackbar(ph, pd, pa) {
    const seg = (cls, v) => '<span class="' + cls + '" style="width:' + (v * 100).toFixed(1) + '%" title="' + pct(v, 1) + '">' + (v >= 0.13 ? pct(v) : "") + "</span>";
    return '<div class="stackbar">' + seg("h", ph) + seg("d", pd) + seg("a", pa) + "</div>";
  }
  function heatHTML(mx, hg, ag, home, away) {
    const vals = mx.map(v => v / 1000);
    const max = Math.max(...vals);
    let h = '<div class="heat" role="table" aria-label="Scoreline chances"><div class="hd"></div>';
    for (let j = 0; j < 7; j++) h += '<div class="hd">' + j + "</div>";
    for (let i = 0; i < 7; i++) {
      h += '<div class="hd">' + i + "</div>";
      for (let j = 0; j < 7; j++) {
        const v = vals[7 * i + j];
        const t = Math.pow(v / max, 0.8);
        const bg = "color-mix(in srgb, var(--heat-1) " + (t * 100).toFixed(0) + "%, var(--heat-0))";
        const ink = t > 0.55 ? "var(--surface)" : "var(--ink-2)";
        h += '<div class="cell' + (i === hg && j === ag ? " actual" : "") + '" style="background:' + bg + ";color:" + ink + '" title="' + esc(home) + " " + i + "-" + j + " " + esc(away) + ": " + pct(v, 1) + '">' + (v >= 0.005 ? (v * 100).toFixed(1) : "") + "</div>";
      }

    return h + '</div><p class="caption">Rows: ' + esc(home) + " goals. Columns: " + esc(away) + " goals.</p>";
  }

      const key = mk.models.bdc || mk.models.model;
      const p = B[key][i];
      const h = mk.happened(i);
      const base = B[mk.models.base][i];
      const mkt = mk.models.mkt_sharp ? B[mk.models.mkt_sharp][i] : NaN;

      const tb = th ? tierBin(i, mk, { high: th.high, low: th.low, width: th.width_max, useWidth: true, promoFlag: false, refFlag: true }) : null;

    });

  function pmfChart(id, pmf, lines) {

        const keyArr = new Float64Array(T);

        const sorted = Array.from(order).sort((u, v) => keyArr[v] - keyArr[u]);
        sorted.forEach((t, place) => { pos[t][place]++; });
        for (let t = 0; t < T; t++) ptsSum[t] += pts[t];
      }
      done = end;
      onProgress(done / total);
      if (done < total) setTimeout(chunk, 0);

        club: c, played: tab[c].pl, now: tab[c].p, pts: ptsSum[t] / total,
        title: pos[t][0] / total, top4: (pos[t][0] + pos[t][1] + pos[t][2] + pos[t][3]) / total,

  }

  function newsCalc(nw) {

      const s = h + d + a;
      return [h / s, d / s, a / s];

      '<div class="table-wrap"><table><thead><tr><th></th><th class="num">' + esc(D.clubs[r.h]) + '</th><th class="num">' + esc(D.clubs[r.a]) + '</th></tr></thead><tbody>' +
      "<tr><td>Expected goals multiplied by</td><td class='num'>x" + sh.toFixed(3) + "</td><td class='num'>x" + sa.toFixed(3) + "</td></tr>" +
      "<tr><td>Expected goals</td><td class='num'>" + r.goals.exp_home.toFixed(2) + " to " + (r.goals.exp_home * sh).toFixed(2) + "</td><td class='num'>" + r.goals.exp_away.toFixed(2) + " to " + (r.goals.exp_away * sa).toFixed(2) + "</td></tr>" +
      "</tbody></table></div>" +
      '<div class="model-rows" style="margin-top:8px"><span class="mname">Without news</span>' + stackbar(before[0], before[1], before[2]) + '<span class="got"></span><span class="mname">With news</span>' + stackbar(after[0], after[1], after[2]) + '<span class="got"></span></div>' +
      '<p class="caption">' + (capped ? '<span class="status bad">12% limit reached</span> ' : "") + "Home, draw, away before and after the answers (a close shortcut to the full model).</p>";
  }
  function fact_(k) { let f = 1; for (let j = 2; j <= k; j++) f *= j; return f; }
  function driftNorms() {
    const idx = rows({ leagues: [0, 1], seasons: TEST });
    const out = [];
    const pair1 = idx.filter(i => isFinite(P.elo[3 * i])).map(i => score1x2(P.bdc, i, "rps") - score1x2(P.elo, i, "rps"));
    out.push({ name: "Home, draw, away (closeness score)", bench: "Club rating points", gap: mean(pair1), ci: bootMean(pair1, 400, 41) });
    [["goals_2.5", "3 or more goals (surprise score)"], ["corners_9.5", "10 or more corners (surprise score)"], ["yellows_4.5", "5 or more yellow cards (surprise score)"]].forEach(([k, name]) => {
      const mk = marketBy(k);
      const key = mk.models.bdc || mk.models.model;
      const vals = idx.filter(i => isFinite(mk.happened(i)) && isFinite(B[key][i]) && isFinite(B[mk.models.base][i])).map(i => scoreBin(B[key][i], mk.happened(i), "log_loss") - scoreBin(B[mk.models.base][i], mk.happened(i), "log_loss"));
      out.push({ name, bench: "League average", gap: mean(vals), ci: bootMean(vals, 400, 43) });
    });
    return out;
  }

  // ------------------------------------------------------------ start
  let start = (location.hash || "").replace("#", "");
  if (!renderers[start]) { try { start = localStorage.getItem("fp-lab-section") || "overview"; } catch (e) { start = "overview"; } }
  show(renderers[start] ? start : "overview");
})();
