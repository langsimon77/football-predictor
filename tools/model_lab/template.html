a { color: var(--accent); }

.topbar {

}
.topbar-inner {

.brand {

main { min-width: 0; display: grid; gap: 18px; align-content: start; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }

.chart-box { position: relative; width: 100%; }
.chart-box.h-220 { height: 220px; }

.explorer { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 18px; align-items: start; }

.stackbar { display: flex; height: 22px; border-radius: 5px; overflow: hidden; gap: 2px; background: var(--surface); }

.pill-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.drivers { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }

.small-multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }

<script>const DATA=/*__DATA__*/null;</script>
<script>
(function () {
  "use strict";
  const D = DATA;
  const BT = D.bt;
  const N = BT.n;
  const TUNE = [2021, 2022];
  const TEST = [2023, 2024, 2025];
  const ALL_SEASONS = [2021, 2022, 2023, 2024, 2025];
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const seasonLabel = s => s + "/" + String((s + 1) % 100).padStart(2, "0");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]));
  const MINUS = "−";
  const num = (v, d) => (v < 0 ? MINUS : "") + Math.abs(v).toFixed(d);
  const signed = (v, d) => (v > 0 ? "+" : v < 0 ? MINUS : "") + Math.abs(v).toFixed(d);
  const pct = (v, d) => isFinite(v) ? (v * 100).toFixed(d == null ? 0 : d) + "%" : "n/a";
  const leagueName = l => l === 1 ? "La Liga" : "EPL";

  // ------------------------------------------------------------ decode data
  function dec(arr) {
    const out = new Float64Array(arr.length);
    for (let i = 0; i < arr.length; i++) out[i] = arr[i] < 0 ? NaN : arr[i] / 1000;
    return out;
  }
  const P = {};
  for (const k in BT.p) P[k] = dec(BT.p[k]);
  const B = {};
  for (const k in BT.bin) B[k] = dec(BT.bin[k]);
  const WD = {};
  for (const k in BT.wd) WD[k] = dec(BT.wd[k]);
  const Y = Int8Array.from(BT.y);
  const HG = Int16Array.from(BT.hg), AG = Int16Array.from(BT.ag);
  const COR = Int16Array.from(BT.cor), YEL = Int16Array.from(BT.yel);
  const LG = Int8Array.from(BT.lg), SS = Int16Array.from(BT.ss);
  const PROMO = Int8Array.from(BT.promo), REFK = Int8Array.from(BT.refk), REDS = Int8Array.from(BT.reds);
  const STACK = D.ev.stack;

  function blend(weights) {
    const out = new Float64Array(N * 3);
    STACK.models.forEach((m, j) => {
      const src = P[m];
      const w = weights[j];
      for (let i = 0; i < N * 3; i++) out[i] += w * src[i];
    });
    return out;
  }
  P.stack = blend(STACK.weights);
  P.equal = blend(STACK.models.map(() => 1 / STACK.models.length));

  const MODELS = {
    bdc: { name: "Bayesian (published)", short: "Bayesian", color: "--s1" },
    stack: { name: "Stack (shadow)", short: "Stack", color: "--s5" },
    equal: { name: "Equal-weight blend", short: "Equal blend" },
    multinomial: { name: "Multinomial", short: "Multinomial" },
    ordered_logit: { name: "Ordered logit", short: "Ordered logit" },
    random_forest: { name: "Random Forest", short: "Random Forest" },
    xgboost: { name: "XGBoost", short: "XGBoost" },
    dc: { name: "Fast Dixon-Coles", short: "Fast DC" },
    elo: { name: "Elo", short: "Elo", color: "--s3" },
    base: { name: "League base rates", short: "Base rates", color: "--neutral-series" },

      explain("<p><b>Log loss</b> punishes confident misses hardest. <b>RPS</b> (ranked probability score, home, draw, away only) rewards putting probability near what happened, so calling a draw when the home side won costs less than calling an away win. <b>Brier</b> is the squared distance from the result. The interval is a 95% bootstrap interval: the match list is resampled 400 times. The difference column is paired, match by match, against the reference; if its whole interval sits below zero, that model is clearly better than the reference on these matches.</p>") +
      "</div>" +
      '<div class="grid-2">' +
      '<div class="panel"><h3>Score by model</h3><div class="chart-box h-360"><canvas id="sb-bars"></canvas></div><p class="caption">Mean score per model; the reference model is highlighted. Lower is better.</p></div>' +
      '<div class="panel"><h3>Running average over the seasons</h3><div id="sb-run-legend"></div><div class="chart-box h-360"><canvas id="sb-run"></canvas></div><p class="caption">Cumulative mean score in date order, up to five headline forecasts.</p>' +
      explain("<p>Early points swing because a few surprising results dominate a short average. Lines that stay apart for hundreds of matches show a real difference; lines that cross often do not.</p>") +
      "</div></div>" +
      '<div class="panel"><h3>Season by season</h3><div class="table-wrap"><table id="sb-seasons-table"></table></div><p class="caption">Mean score for each season on its own; a model that wins one season and loses the next has no stable edge.</p></div>';
    $("#sb-market").addEventListener("change", e => { sb.market = e.target.value; setupModels(); draw(); });

      bindChips("sb-model-chips", vals => { sb.models = vals; if (sb.models.indexOf(sb.ref) < 0) sb.models.push(sb.ref); draw(); });
    }
    function scoresFor(mk, models, idx) {
      const out = {};
      models.forEach(m => {
        if (mk.type === "1x2") out[m] = idx.map(i => score1x2(P[m], i, sb.metric));
        else { const arr = B[mk.models[m]]; out[m] = idx.map(i => scoreBin(arr[i], mk.happened(i), sb.metric)); }
      });
      return out;
    }
    function commonIdx(mk, models, filt) {
      return rows(filt).filter(i => {
        if (mk.type === "1x2") return models.every(m => isFinite(P[m][3 * i]));
        const h = mk.happened(i);
        return isFinite(h) && models.every(m => isFinite(B[mk.models[m]][i]));
      });
    }
    function draw() {
      const mk = marketBy(sb.market);
      const models = sb.models.slice();
      const idx = commonIdx(mk, models, { leagues: sb.leagues, seasons: sb.seasons });
      const sc = scoresFor(mk, models, idx);
      const ref = sc[sb.ref];
      const res = models.map(m => {

        const diff = v.map((x, j) => x - ref[j]);
        const dci = m === sb.ref ? [NaN, NaN] : bootMean(diff, 400, 5);
        return { m, mean: mean(v), ci, diff: mean(diff), dci };
      }).sort((a, b) => a.mean - b.mean);
      const metricName = { log_loss: "Log loss", rps: "RPS", brier: "Brier" }[sb.metric];
      $("#sb-title").textContent = mk.name + ": " + metricName;
      const maxV = Math.max(...res.map(r => r.mean)), minV = Math.min(...res.map(r => r.mean));
      $("#sb-table").innerHTML = "<thead><tr><th>Model</th><th class='num'>Mean</th><th class='num'>95% interval</th><th class='num'>Minus " + esc(MODELS[sb.ref].short) + "</th><th class='num'>95% interval</th><th>Verdict</th><th class='bar-cell'></th></tr></thead><tbody>" +
        res.map(r => {

          const w = maxV > minV ? 12 + 88 * (r.mean - minV) / (maxV - minV) : 50;
          return "<tr class='" + (r.m === sb.ref ? "ref" : "") + "'><td>" + esc(MODELS[r.m].name) + "</td><td class='num'>" + r.mean.toFixed(4) + "</td><td class='num ci'>" + r.ci[0].toFixed(4) + " to " + r.ci[1].toFixed(4) + "</td><td class='num'>" + (r.m === sb.ref ? "" : signed(r.diff, 4)) + "</td><td class='num ci'>" + (r.m === sb.ref ? "" : signed(r.dci[0], 4) + " to " + signed(r.dci[1], 4)) + "</td><td>" + verdict + "</td><td class='bar-cell'><div class='minibar" + (r.m === sb.ref ? "" : " muted") + "' style='width:" + w.toFixed(0) + "%'></div></td></tr>";
        }).join("") + "</tbody>";
      const leagueTxt = sb.leagues.length === 2 ? "both leagues" : leagueName(sb.leagues[0]);
      $("#sb-caption").textContent = idx.length.toLocaleString() + " matches (" + leagueTxt + "; " + sb.seasons.slice().sort().map(seasonLabel).join(", ") + ") priced by every shown model. Sorted best first.";
      chart("sb-bars", {
        type: "bar",
        data: { labels: res.map(r => MODELS[r.m].short), datasets: [{ data: res.map(r => r.mean), backgroundColor: res.map(r => r.m === sb.ref ? css("--s1") : css("--neutral-series")), borderRadius: 4, borderSkipped: "start", barPercentage: 0.72, whiskers: res.map(r => ({ x: r.ci })) }] },
        options: baseOptions({ indexAxis: "y", scales: { x: { min: Math.max(0, minV - (maxV - minV) * 1.2 - 0.002), title: { display: true, text: metricName, color: css("--muted") } }, y: { grid: { display: false } } }, plugins: { tooltip: { callbacks: { label: c => " " + metricName + " " + c.raw.toFixed(4) } } } }),
      });
      const headline = ["bdc", "mkt_sharp", "elo", "mkt_pre", "stack", "model", "base"].filter(m => models.indexOf(m) >= 0).slice(0, 5);
      const datasets = headline.map(m => {
        const v = sc[m];
        let s = 0;
        const pts = [];
        const step = Math.max(1, Math.floor(v.length / 400));
        for (let j = 0; j < v.length; j++) { s += v[j]; if (j >= 29 && (j % step === 0 || j === v.length - 1)) pts.push({ x: j + 1, y: s / (j + 1) }); }
        const color = css(MODELS[m].color || "--neutral-series");
        return { label: MODELS[m].name, data: pts, borderColor: color, backgroundColor: color, borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: 0, borderDash: m === "base" ? [5, 4] : [] };
      });
      $("#sb-run-legend").innerHTML = legendHTML(datasets.map(d => ({ label: d.label, color: d.borderColor, line: true })));
      chart("sb-run", {
        type: "line",
        data: { datasets },
        options: baseOptions({ interaction: { mode: "index", intersect: false }, scales: { x: { type: "linear", title: { display: true, text: "Matches scored, in date order", color: css("--muted") } }, y: { title: { display: true, text: "Running mean " + metricName, color: css("--muted") } } }, plugins: { tooltip: { callbacks: { title: c => "After " + c[0].raw.x + " matches (" + BT.date[idx[c[0].raw.x - 1]] + ")", label: c => " " + c.dataset.label + ": " + c.raw.y.toFixed(4) } } } }),
      });

  function stackbar(ph, pd, pa) {

  function heatHTML(mx, hg, ag, home, away) {

  function ratingsOf(lg) {
    const S = D.sim[lg];
    const T = S.clubs.length, K = S.mu.length;
    return S.clubs.map((c, t) => {
      const a = [], d = [];
      for (let k = 0; k < K; k++) { a.push(Math.exp(S.att[k * T + t])); d.push(Math.exp(S.def[k * T + t])); }
      a.sort((x, y) => x - y); d.sort((x, y) => x - y);
      const q = (arr, p) => arr[Math.min(arr.length - 1, Math.floor(p * arr.length))];
      return { club: c, att: mean(a), attLo: q(a, 0.1), attHi: q(a, 0.9), def: mean(d), defLo: q(d, 0.1), defHi: q(d, 0.9) };
    });
  }
  function currentTable(lg) {
    const S = D.sim[lg];
    const tab = {};
    S.clubs.forEach(c => { tab[c] = { p: 0, gd: 0, gf: 0, pl: 0 }; });
    S.results.forEach(([h, a, x, y]) => {
      if (!tab[h] || !tab[a]) return;
      tab[h].pl++; tab[a].pl++;
      tab[h].gf += x; tab[a].gf += y; tab[h].gd += x - y; tab[a].gd += y - x;
      if (x > y) tab[h].p += 3; else if (x < y) tab[a].p += 3; else { tab[h].p++; tab[a].p++; }
    });
    return tab;
  }
  function poisson(lam, r) {
    const L = Math.exp(-lam);
    let k = 0, p = 1;
    do { k++; p *= r(); } while (p > L && k < 30);
    return k - 1;
  }
  function simulate(lg, opts, onProgress, onDone) {
    const S = D.sim[lg];
    const T = S.clubs.length, K = S.mu.length;
    const local = {}; S.clubs.forEach((c, t) => { local[c] = t; });
    const tab = currentTable(lg);
    const basePts = S.clubs.map(c => tab[c].p), baseGd = S.clubs.map(c => tab[c].gd), baseGf = S.clubs.map(c => tab[c].gf);
    const rem = S.remaining.map(([h, a]) => [local[h], local[a]]).filter(x => x[0] != null && x[1] != null);
    const club = opts.club != null ? local[opts.club] : -1;
    const r = rng(20260926);
    const pos = Array.from({ length: T }, () => new Float64Array(T));
    const ptsSum = new Float64Array(T);
    const pts = new Float64Array(T), gd = new Float64Array(T), gf = new Float64Array(T);
    const order = new Int32Array(T);
    let done = 0;
    const total = opts.n;
    function chunk() {
      const end = Math.min(total, done + 400);
      for (let s = done; s < end; s++) {
        const k = (r() * K) | 0;
        for (let t = 0; t < T; t++) { pts[t] = basePts[t]; gd[t] = baseGd[t]; gf[t] = baseGf[t]; }
        const mu = S.mu[k], hm = S.home[k] * opts.home;
        for (let m = 0; m < rem.length; m++) {
          const h = rem[m][0], a = rem[m][1];
          let lam = Math.exp(mu + hm + S.att[k * T + h] + S.def[k * T + a]);
          let nu = Math.exp(mu + S.att[k * T + a] + S.def[k * T + h]);
          if (h === club) { lam *= opts.att; nu *= opts.def; }
          if (a === club) { nu *= opts.att; lam *= opts.def; }
          const x = poisson(lam, r), y = poisson(nu, r);
          if (x > y) pts[h] += 3; else if (x < y) pts[a] += 3; else { pts[h]++; pts[a]++; }
          gd[h] += x - y; gd[a] += y - x; gf[h] += x; gf[a] += y;
        }
        for (let t = 0; t < T; t++) order[t] = t;
        const keyArr = new Float64Array(T);
        for (let t = 0; t < T; t++) keyArr[t] = pts[t] * 1e6 + (gd[t] + 1000) * 1e3 + gf[t] + r() * 1e-3;
        const sorted = Array.from(order).sort((u, v) => keyArr[v] - keyArr[u]);
        sorted.forEach((t, place) => { pos[t][place]++; });
        for (let t = 0; t < T; t++) ptsSum[t] += pts[t];
      }
      done = end;
      onProgress(done / total);
      if (done < total) setTimeout(chunk, 0);
      else onDone(S.clubs.map((c, t) => ({
        club: c, played: tab[c].pl, now: tab[c].p, pts: ptsSum[t] / total,
        title: pos[t][0] / total, top4: (pos[t][0] + pos[t][1] + pos[t][2] + pos[t][3]) / total,
        releg: (pos[t][T - 1] + pos[t][T - 2] + pos[t][T - 3]) / total,
        meanPos: pos[t].reduce((acc, v, p) => acc + v * (p + 1), 0) / total,
        dist: Array.from(pos[t]).map(v => v / total),
      })));
    }
    chunk();
  }

    const rawA = 1 - loss(nw.as, nw.at) + conc(nw.hs, nw.ht);
    const clip = v => Math.min(Math.max(v, 0.88), 1.12);
    const sh = clip(rawH), sa = clip(rawA);
    const capped = sh !== rawH || sa !== rawA;
    const oneXtwo = (lh, la) => {
      const ph = [], pa = [];
      for (let k = 0; k <= 10; k++) { ph.push(Math.exp(-lh) * Math.pow(lh, k) / fact_(k)); pa.push(Math.exp(-la) * Math.pow(la, k) / fact_(k)); }
      let h = 0, d = 0, a = 0;
      for (let i = 0; i <= 10; i++) for (let j = 0; j <= 10; j++) { const v = ph[i] * pa[j]; if (i > j) h += v; else if (i === j) d += v; else a += v; }
      const s = h + d + a;
      return [h / s, d / s, a / s];
    };
    const before = oneXtwo(r.goals.exp_home, r.goals.exp_away);
    const after = oneXtwo(r.goals.exp_home * sh, r.goals.exp_away * sa);
    $("#nw-out").innerHTML =
      '<div class="table-wrap"><table><thead><tr><th></th><th class="num">' + esc(D.clubs[r.h]) + '</th><th class="num">' + esc(D.clubs[r.a]) + '</th></tr></thead><tbody>' +
      "<tr><td>Scoring rate multiplier</td><td class='num'>x" + sh.toFixed(3) + "</td><td class='num'>x" + sa.toFixed(3) + "</td></tr>" +
      "<tr><td>Expected goals</td><td class='num'>" + r.goals.exp_home.toFixed(2) + " to " + (r.goals.exp_home * sh).toFixed(2) + "</td><td class='num'>" + r.goals.exp_away.toFixed(2) + " to " + (r.goals.exp_away * sa).toFixed(2) + "</td></tr>" +
      "</tbody></table></div>" +
      '<div class="model-rows" style="margin-top:8px"><span class="mname">Without news</span>' + stackbar(before[0], before[1], before[2]) + '<span class="got"></span><span class="mname">With news</span>' + stackbar(after[0], after[1], after[2]) + '<span class="got"></span></div>' +
      '<p class="caption">' + (capped ? '<span class="status bad">Cap reached</span> ' : "") + "Home, draw, away before and after the answers (approximation from expected goals).</p>";
  }
  function fact_(k) { let f = 1; for (let j = 2; j <= k; j++) f *= j; return f; }
  function driftNorms() {
    const idx = rows({ leagues: [0, 1], seasons: TEST });
    const out = [];
    const pair1 = idx.filter(i => isFinite(P.elo[3 * i])).map(i => score1x2(P.bdc, i, "rps") - score1x2(P.elo, i, "rps"));
    out.push({ name: "Home, draw, away (RPS)", bench: "Elo", gap: mean(pair1), ci: bootMean(pair1, 400, 41) });
    [["goals_2.5", "Over 2.5 goals (log loss)"], ["corners_9.5", "Over 9.5 corners (log loss)"], ["yellows_4.5", "Over 4.5 yellows (log loss)"]].forEach(([k, name]) => {
      const mk = marketBy(k);
      const key = mk.models.bdc || mk.models.model;
      const vals = idx.filter(i => isFinite(mk.happened(i)) && isFinite(B[key][i]) && isFinite(B[mk.models.base][i])).map(i => scoreBin(B[key][i], mk.happened(i), "log_loss") - scoreBin(B[mk.models.base][i], mk.happened(i), "log_loss"));
      out.push({ name, bench: "League base rate", gap: mean(vals), ci: bootMean(vals, 400, 43) });
    });
    return out;
  }

  // ------------------------------------------------------------ start
  let start = (location.hash || "").replace("#", "");
  if (!renderers[start]) { try { start = localStorage.getItem("fp-lab-section") || "overview"; } catch (e) { start = "overview"; } }
  show(renderers[start] ? start : "overview");
})();
</script>
