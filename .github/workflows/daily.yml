name: Daily predictions

on:
  schedule:
    - cron: "41 4 * * *"   # 04:41 UTC = 06:41 Juba. Off the hour: GitHub delays on-the-hour jobs.
    # Backups: GitHub can delay or drop scheduled runs (25 Sep ran 5 hours late; the
    # 26 Sep run never started). A backup does nothing if today's run already committed.
    - cron: "41 10 * * *"
    - cron: "41 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: compute everything, lock nothing, commit nothing"
        type: boolean
        default: true
      force_error:
        description: "Failure-path test (dry runs only): none, bayes (diagnostics fail), crash"
        type: choice
        options: [none, bayes, crash]
        default: none

permissions:
  contents: write  # commit the ledger and report
  issues: write    # open an issue if the run fails

concurrency:
  group: daily
  cancel-in-progress: false  # never interrupt a run that may be writing the ledger

jobs:
  guard:
    # A scheduled run skips itself when today's daily run has already committed.
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          skip=false
          if [ "$EVENT" = "schedule" ]; then
            today=$(date -u +%F)
            if gh api "repos/${{ github.repository }}/commits?sha=main&since=${today}T00:00:00Z&per_page=100" \
                 --jq '.[].commit.message' | grep -q "^Daily run ${today}"; then
              skip=true
              echo "Today's daily run already committed; this scheduled run does nothing."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  daily:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag exists
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Restore raw data cache
        uses: actions/cache@v6
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Restore the last good Bayesian posteriors (fallback store)
        uses: actions/cache@v6
        with:
          path: data/posteriors
          key: posteriors-${{ github.run_id }}
          restore-keys: posteriors-

      - name: Restore dashboard files (match details frozen at lock)
        uses: actions/cache@v6
        with:
          path: app/data
          key: dashboard-${{ github.run_id }}
          restore-keys: dashboard-

      - name: Run the daily pipeline
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
          GH_TOKEN: ${{ github.token }}  # Question Queue: read ticks, open and close Issues
          FP_FORCE_FAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_error != 'none' && inputs.force_error || '' }}
          FP_PROBLEMS_FILE: ${{ runner.temp }}/problems.txt
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            uv run python -m fp.pipeline.daily --dry-run
          else
            uv run python -m fp.pipeline.daily
          fi

      - name: Ledger is append-only against the last commit
        env:
          BASE_SHA: HEAD
        run: uv run python scripts/check_ledger.py

      - name: No banned dash characters in the report
        run: uv run python scripts/check_dashes.py

      - name: Commit and push the ledger and report
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in ledger reports data/manual/answers.yaml data/manual/managers.csv \
                      app/data/ratings_history.csv; do
            [ -e "$path" ] && git add "$path"
          done
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            # Keep the repo active so GitHub does not pause this schedule after 60 days.
            git commit --allow-empty -m "Daily run $(date -u +%F): no new locks"
          else
            git commit -m "Daily run $(date -u +%F): lock predictions, record results"
          fi
          git pull --rebase  # in case code was pushed while this run was working
          git push

      - name: Package the static fixtures page
        if: env.DRY_RUN != 'true' && vars.PAGES_ENABLED == 'true' && hashFiles('site/index.html') != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Open an issue if the run locked with a fallback or skipped a step
        env:
          GH_TOKEN: ${{ github.token }}
          PROBLEMS: ${{ runner.temp }}/problems.txt
        run: |
          if [ -s "$PROBLEMS" ]; then
            {
              echo "The daily run finished, but not cleanly. Forecasts were locked from the last good model where needed and marked degraded."
              echo
              echo '```'
              cat "$PROBLEMS"
              echo
              echo '```'
              echo
              echo "Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > "$RUNNER_TEMP/issue.md"
            gh issue create --title "Daily run degraded: $(date -u +%F)" --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Open an issue if the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Daily run failed: $(date -u +%F)" \
            --body "The daily run failed. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  pages:
    # Publishes the static fixtures page and the dashboard files. Runs only once
    # GitHub Pages is switched on for this repository (PAGES_ENABLED variable).
    needs: daily
    if: vars.PAGES_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
