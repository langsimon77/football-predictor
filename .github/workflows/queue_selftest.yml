name: Question Queue self-test

# Opens one test Issue with a made-up match, ticks it as the bot, reads the ticks
# back through the trust rule, and closes it. Same token and code path as the
# daily run. Run by hand when the queue code changes.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Reuse this earlier test Issue number (blank opens a new one)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag exists
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Round trip
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          if [ -n "$ISSUE" ]; then
            uv run python scripts/queue_selftest.py --issue "$ISSUE"
          else
            uv run python scripts/queue_selftest.py
          fi
