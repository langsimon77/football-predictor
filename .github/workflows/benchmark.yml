name: Sampler benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag exists
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Restore raw data cache
        uses: actions/cache@v6
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Build data
        run: make data

      - name: Benchmark nutpie and NumPyro
        run: uv run python scripts/benchmark_samplers.py | tee benchmark.txt

      - name: Job summary
        run: |
          echo "## Sampler benchmark" >> "$GITHUB_STEP_SUMMARY"
          sed -n '/^Machine:/,$p' benchmark.txt >> "$GITHUB_STEP_SUMMARY"
